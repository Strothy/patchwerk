name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  engine:
    # The engine is plain Rust: its fixture and unit tests run without Tauri or a webview.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test -p patchwerk-engine
