[package]
name = "patchwerk"
version = "0.1.0"
description = "Patchwerk - modular patching for motion hardware"
authors = ["Strothy"]
license = "GPL-3.0-only"
repository = "https://github.com/Strothy/patchwerk"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "patchwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
patchwerk-engine = { path = "../crates/engine" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.4.4"
